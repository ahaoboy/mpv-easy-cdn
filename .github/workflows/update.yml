name: update

permissions:
  contents: write

on:
  push:
    branches:
      - dev
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

jobs:
  update:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: install
        run: |
          bun i

      - name: update base
        run: |
          bun run update-base
          ls -l

      - name: update-zip
        # update.ts downloads scripts-full.json, writes the zip size of each
        # successfully packaged script into it, then saves it as scripts-full.json
        run: |
          bun run update-zip
          ls -l

      - name: commit
        run: |
          git config user.name "MPV_EASY_CDN_UPDATER"
          git config user.email "MPV_EASY_CDN_UPDATER@example.com"
          git add .
          git commit -m "update assets [skip ci]"
          git branch -M main
          git push -f origin main
